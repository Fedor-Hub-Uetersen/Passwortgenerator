name: Build Android APK from Subdomain

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Web App APK
        uses: SwagMasterPro/web-to-apk-action@v1.2
        with:
          target-url: 'http://passwortgenerator.chebur.shop/'
          app-name: 'Генератор Паролей'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Passwort-Generator-APK
          path: output/*.apk
